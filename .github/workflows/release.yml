name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build release binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X github.com/Priyasharma620064/kubedriftguard/internal/version.Version=${VERSION} \
                   -X github.com/Priyasharma620064/kubedriftguard/internal/version.GitCommit=${GIT_COMMIT} \
                   -X github.com/Priyasharma620064/kubedriftguard/internal/version.BuildDate=${BUILD_DATE}"

          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              echo "Building for ${GOOS}/${GOARCH}..."
              GOOS=${GOOS} GOARCH=${GOARCH} go build -v \
                -ldflags "${LDFLAGS}" \
                -o dist/kubedriftguard-${GOOS}-${GOARCH} \
                ./cmd/controller/
            done
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum kubedriftguard-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/kubedriftguard-*
            dist/checksums.txt
