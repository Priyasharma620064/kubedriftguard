apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubedriftguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedriftguard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubedriftguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubedriftguard.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubedriftguard.serviceAccountName" . }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /kubedriftguard
            - controller
            - --metrics-addr={{ .Values.controller.metricsAddr }}
            - --health-addr={{ .Values.controller.healthAddr }}
            {{- if .Values.controller.dryRun }}
            - --dry-run
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kubedriftguard
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "kubedriftguard.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
